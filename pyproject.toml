[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-project-2026"
version = "0.1.0"
description = "Python multi-agent operations diagnosis copilot."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "langgraph>=0.2",
    "openai>=1.40",
    "chromadb>=1.0,<1.1",
    "jieba>=0.42",
    "FlagEmbedding==1.4.0",
    "transformers==4.57.6",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
    "ruff"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app", "app.*"]
exclude = ["data", "data.*", "tests", "tests.*"]
