name: kimi_generation
description: Hybrid RAG retrieval followed by Kimi answer generation.
retriever: hybrid_rrf
vector_store: chroma
collection_name: ops_knowledge_base_hash
docs_dir: data/docs
embedding:
  provider: hash
  name: HashEmbeddingFunction
  dimensions: 64
chunking:
  strategy: character
  chunk_size: 500
  overlap: 50
ranking:
  top_k_default: 3
  top_n: 10
  retrieve_top_n: 10
  rerank_top_k: 3
  rrf_k: 60
  score_threshold: null
reranker:
  provider: none
llm:
  provider: kimi
  model: kimi-k2.6
  base_url: https://api.moonshot.cn/v1
  api_key_env: MOONSHOT_API_KEY
  temperature: 0.2
  max_tokens: 1200
  timeout: 60
notes:
  - Requires MOONSHOT_API_KEY in the environment.
  - This config is for answer generation, not retrieval-only evaluation.
