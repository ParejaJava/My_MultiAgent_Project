name: openai_embedding
description: OpenAI embedding provider with Chroma dense retrieval.
retriever: chroma_dense
vector_store: chroma
persist_directory: D:/AgentData/VectorStore
collection_name: ops_knowledge_base_openai
embedding:
  provider: openai
  model: text-embedding-3-small
chunking:
  strategy: character
  chunk_size: 500
  overlap: 50
ranking:
  top_k_default: 3
  retrieve_top_n: 10
  rerank_top_k: 3
  score_threshold: null
reranker:
  provider: none
notes:
  - Requires OPENAI_API_KEY in the environment.
  - Re-ingest documents with this config before querying.
