name: bge_base_zh_v15
description: FlagEmbedding BAAI/bge-base-zh-v1.5 embedding provider with Chroma dense retrieval.
retriever: chroma_dense
vector_store: chroma
persist_directory: D:/AgentData/VectorStore
collection_name: ops_knowledge_base_bge_base_zh_v15
embedding:
  provider: bge_local
  implementation: flag_embedding
  model: D:/AgentData/Models/bge-base-zh-v1.5
  normalize_embeddings: true
  max_length: 512
  batch_size: 16
  use_fp16: true
  devices: null
chunking:
  strategy: character
  chunk_size: 500
  overlap: 50
ranking:
  top_k_default: 3
  retrieve_top_n: 10
  rerank_top_k: 3
  score_threshold: null
reranker:
  provider: none
notes:
  - Requires FlagEmbedding to be installed.
  - Re-ingest documents with this config before querying.
